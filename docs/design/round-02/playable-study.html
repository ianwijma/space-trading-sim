  width: 100%;
  min-height: 50px;
  border: 1px solid #f3d6a1;
  font-size: 13px;
  font-weight: 600;
  border-radius: 5px;
  margin-bottom: 12px;
}
.report-window {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 10px;
  margin-bottom: 18px;
}
.report-totals {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 28px;
}
.report-totals>div {
  padding: 14px;
  background: #1f2f38;
  border: 1px solid var(--edge);
  border-radius: 5px;
}
.report-totals span {
  font-size: 11px;
  color: var(--muted);
  display: block;
  margin-bottom: 5px;
}
.report-totals strong {
  font-size: 25px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.report-totals small {
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
}
.flow-row {
  margin: 20px 0;
}
.flow-row>div {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 7px;
}
.flow-row strong {
  font-weight: 500;
}
.flow-row span {
  color: var(--muted);
  font-size: 11px;
}
.flow-row small {
  color: var(--muted);
  font-size: 10px;
}
meter,progress {
  width: 100%;
  height: 6px;
  border: 0;
  border-radius: 3px;
  background: #2c404b;
  margin: 6px 0;
  display: block;
  overflow: hidden;
}
meter::-webkit-meter-bar {
  border: 0;
  background: #2c404b;
  border-radius: 3px;
}
meter::-webkit-meter-optimum-value,progress::-webkit-progress-value {
  background: var(--mint);
  border-radius: 3px;
}
progress::-webkit-progress-bar {
  background: #2c404b;
}
meter::-moz-meter-bar,progress::-moz-progress-bar {
  background: var(--mint);
}
.report-note {
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
  border-left: 2px solid #d8b97866;
  padding: 9px 12px;
  background: #d8b97805;
  margin-top: 20px;
}
.fleet-metrics {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  padding-bottom: 12px;
}
.fleet-row {
  width: 100%;
  display: flex;
  align-items: center;
  text-align: left;
  gap: 11px;
  padding: 14px 0;
  min-height: 66px;
  border: 0;
  border-bottom: 1px solid var(--edge);
  background: transparent;
}
.fleet-row>svg {
  color: var(--mint);
}
.fleet-row>span:nth-child(2) {
  flex: 1;
}
.fleet-row strong {
  display: block;
  font-size: 12px;
  font-weight: 500;
}
.fleet-row small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}
.fleet-row>span:nth-child(3) {
  font-size: 10px;
  color: var(--muted);
}
.section-gap {
  margin-top: 26px;
  margin-bottom: 12px;
}
.record-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding: 9px 0;
}
.record-row span {
  color: var(--muted);
}
.record-row strong {
  font-weight: 500;
}
.intro-copy {
  font-size: 16px;
  color: #d3dedf;
  line-height: 1.6;
}
.help-steps {
  list-style: none;
  counter-reset: steps;
  margin: 20px 0 0;
  padding: 0;
}
.help-steps li {
  position: relative;
  counter-increment: steps;
  padding: 0 0 20px 30px;
}
.help-steps li:before {
  content: counter(steps);
  position: absolute;
  left: 0;
  top: 1px;
  color: var(--gold);
  font-size: 12px;
}
.help-steps strong {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 5px;
}
.help-steps span {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  display: block;
}
@media (max-width:900px) {
  .hud-resources {
    gap: 18px;
  }
  .hud-resources small,.population-hud {
    display: none !important;
  }
  .command-header {
    gap: 20px;
  }
  .event-line {
    left: 24px;
    right: 24px;
    bottom: 84px;
    max-width: none;
    font-size: 10px;
    pointer-events: none;
  }
  .event-line>span {
    justify-content: center;
    width: fit-content;
    margin: auto;
    padding: 4px 9px;
    background: #14202adb;
    border-radius: 4px;
  }
  .selection-dock {
    bottom: 117px;
  }
  .map-tools {
    bottom: 118px;
  }
}
@media (max-width:639px) {
  .command-header {
    height: calc(62px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
    gap: 15px;
  }
  .brand-mark {
    min-width: 0;
    gap: 0;
  }
  .brand-mark>svg {
    width: 31px;
    height: 31px;
    padding: 5px;
  }
  .brand-mark>div {
    display: none;
  }
  .hud-resources {
    gap: 16px;
  }
  .hud-resources>span {
    gap: 6px;
  }
  .hud-resources b {
    font-size: 13px;
  }
  .hud-resources svg {
    width: 14px;
  }
  .header-controls {
    gap: 0;
  }
  .match-clock {
    font-size: 10px;
    gap: 5px;
    margin-right: 0;
  }
  .header-controls>.icon-button {
    min-width: 44px;
  }
  .help-toggle {
    display: none;
  }
  .map-area {
    top: calc(62px + env(safe-area-inset-top));
  }
  .map-heading {
    top: calc(77px + env(safe-area-inset-top));
    left: 15px;
    right: 15px;
    justify-content: space-between;
    gap: 8px;
  }
  .map-heading .eyebrow {
    font-size: 8px;
    letter-spacing: 1.1px;
  }
  .study-tag {
    font-size: 7px;
    letter-spacing: .7px;
    border: 0;
    padding: 0;
  }
  .threat-chip {
    top: calc(106px + env(safe-area-inset-top));
    left: 15px;
    min-height: 44px;
    font-size: 10px;
    padding: 5px 9px;
  }
  .target-prompt {
    top: calc(106px + env(safe-area-inset-top));
    gap: 8px;
    padding-left: 10px;
    width: calc(100% - 24px);
  }
  .target-prompt>span {
    font-size: 12px;
    flex: 1;
  }
  .target-prompt .icon-button {
    min-width: 38px;
    margin: 0;
  }
  .paused-banner {
    top: calc(169px + env(safe-area-inset-top));
    font-size: 11px;
  }
  .selection-dock {
    left: 12px;
    right: 12px;
    width: auto;
    max-width: none;
    bottom: calc(107px + env(safe-area-inset-bottom));
  }
  .selection-title {
    padding: 10px 12px 8px;
    gap: 10px;
  }
  .selection-title h1 {
    font-size: 19px;
  }
  .resource-token {
    width: 36px;
    height: 36px;
    font-size: 13px;
  }
  .selection-title div>span {
    font-size: 10px;
  }
  .colony-stats {
    padding: 0 12px 10px;
    gap: 9px;
    font-size: 10px;
  }
  .colony-stats svg {
    width: 12px;
  }
  .colony-stats>span:last-child {
    margin-left: auto;
  }
  .context-actions button {
    min-height: 49px;
  }
  .fleet-actions button {
    font-size: 11px;
  }
  .bottom-nav {
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 0;
    border-left: 0;
    border-right: 0;
    border-bottom: 0;
    padding: 5px 6px calc(5px + env(safe-area-inset-bottom));
    justify-content: space-around;
    gap: 0;
  }
  .bottom-nav>button {
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 5px 4px;
    min-width: 52px;
    flex: 1;
    min-height: 55px;
    font-size: 10px;
  }
  .bottom-nav>button>svg {
    width: 19px;
    height: 19px;
  }
  .bottom-nav>.mobile-help {
    display: flex;
  }
  .bottom-nav small {
    font-size: 8px;
    min-width: 13px;
    height: 13px;
    padding: 0 3px;
  }
  .event-line {
    bottom: calc(77px + env(safe-area-inset-bottom));
    left: 12px;
    right: 12px;
    font-size: 9px;
    line-height: 1.5;
  }
  .event-line>span {
    padding: 3px 6px;
  }
  .event-line>span>svg {
    display: none;
  }
  .map-tools {
    flex-direction: column;
    right: 12px;
    bottom: calc(290px + env(safe-area-inset-bottom));
    padding: 2px;
    border-radius: 6px;
    gap: 0;
  }
  .map-tools>.icon-button {
    min-width: 44px;
    width: 44px;
    height: 44px;
  }
  .detail-panel {
    top: auto;
    left: 12px;
    right: 12px;
    bottom: calc(108px + env(safe-area-inset-bottom));
    width: auto;
    max-height: min(66dvh,calc(100dvh - 186px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    height: auto;
  }
  .detail-panel>header {
    padding: 13px 12px 12px 17px;
  }
  .detail-panel h2 {
    font-size: 18px;
  }
  .panel-scroll {
    padding: 17px;
  }
  .detail-panel .eyebrow {
    font-size: 9px;
  }
  .map-hint {
    width: 100%;
    justify-content: center;
    font-size: 11px;
  }
  .ship-illustration {
    padding: 8px;
    margin-bottom: 12px;
  }
  .ship-illustration svg {
    height: 55px;
  }
  .crew-impact {
    margin-top: 14px;
    padding: 13px 0;
  }
  .crew-impact h3 {
    font-size: 15px;
    margin-bottom: 12px;
  }
  .crew-impact p {
    margin-top: 10px;
  }
  .support-line {
    margin: 13px 0;
  }
}
@media (max-height:540px) and (min-width:640px) {
  .command-header {
    height: 56px;
  }
  .map-area {
    top: 56px;
  }
  .map-heading {
    top: 68px;
  }
  .threat-chip {
    top: 90px;
  }
  .selection-dock {
    width: 360px;
    bottom: 92px;
  }
  .detail-panel {
    top: 70px;
    bottom: 87px;
    max-height: none;
    width: 340px;
  }
  .map-tools {
    bottom: 90px;
  }
  .event-line {
    bottom: 84px;
  }
}
